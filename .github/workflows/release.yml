name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза. Пусто — вычислить: тег текущей ревизии или v<version из plugin.json>"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require a merged pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse HEAD)"
          count="$(gh api "repos/${{ github.repository }}/commits/$sha/pulls" --jq 'length' 2>/dev/null || echo 0)"
          if [ "${count:-0}" -eq 0 ]; then
            echo "ошибка: коммит $sha не связан ни с одним PR — релиз только из merge PR" >&2
            exit 1
          fi
          echo "PR для $sha найден: $count"

      - name: Repository check
        run: make check

      - name: Tests
        run: make test

      - name: Routing eval
        run: make routing-eval

      - name: Resolve and verify release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          version="v$(python3 -c 'import json; print(json.load(open("plugin.json"))["version"])')"
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$version"
          fi
          if [ "$tag" != "$version" ]; then
            echo "ошибка: тег $tag не совпадает с версией $version из plugin.json — релиз остановлен" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build release artifact
        run: python3 ./scripts/pack.py --release

      - name: Release notes from changelog
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          python3 ./scripts/release_notes.py --version "${VERSION#v}" > /tmp/release-notes.md
          cat /tmp/release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" --title "skills-kit $TAG" --notes-file /tmp/release-notes.md --target "$GITHUB_SHA"
          fi

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          zip="dist/skills-kit-${VERSION#v}.zip"
          test -f "$zip" || { echo "нет артефакта $zip" >&2; exit 1; }
          gh release upload "$TAG" "$zip"
