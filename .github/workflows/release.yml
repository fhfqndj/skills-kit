name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза. Пусто — вычислить: тег текущей ревизии или v<version из plugin.json>"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve and verify release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          version="v$(python3 -c 'import json; print(json.load(open("plugin.json"))["version"])')"
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$version"
          fi
          if [ "$tag" != "$version" ]; then
            echo "ошибка: тег $tag не совпадает с версией $version из plugin.json — релиз остановлен" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Гейт запускает scripts/check_release_pr.py из дерева тега: перевыпуск
      # тегов, созданных до появления этого workflow, новой проверкой не поддерживается.
      - name: Require a merged pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            sha="$(git rev-parse "refs/tags/$TAG^{commit}")"
          else
            echo "тег $TAG ещё не создан — проверяю HEAD"
            sha="$(git rev-parse HEAD)"
          fi
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor "$sha" origin/master; then
            echo "ошибка: коммит $sha не входит в master — релиз только из влитого PR" >&2
            exit 1
          fi
          if ! gh api "repos/$REPO/commits/$sha/pulls" > "$RUNNER_TEMP/pulls.json"; then
            echo "ошибка: не удалось получить PR для $sha" >&2
            exit 1
          fi
          python3 scripts/check_release_pr.py "$RUNNER_TEMP/pulls.json"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Repository check
        run: make check

      - name: Tests
        run: make test

      - name: Routing eval
        run: make routing-eval

      - name: Build release artifact
        run: python3 ./scripts/pack.py --release

      - name: Release notes from changelog
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          python3 ./scripts/release_notes.py --version "${VERSION#v}" > /tmp/release-notes.md
          cat /tmp/release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" --title "skills-kit $TAG" --notes-file /tmp/release-notes.md --target "$GITHUB_SHA"
          fi

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          zip="dist/skills-kit-${VERSION#v}.zip"
          test -f "$zip" || { echo "нет артефакта $zip" >&2; exit 1; }
          gh release upload "$TAG" "$zip"
